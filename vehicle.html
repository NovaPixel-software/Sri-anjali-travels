<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Details — Sri Anjali Travels</title>
<meta name="description" content="Full specifications and live per-KM fare for each Sri Anjali Travels vehicle.">
<link rel="icon" href="assets/img/logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="siteHeader"></div>

<main>
  <div class="pagebar">
    <div class="wrap pagebar__inner">
      <a class="back" href="vehicles.html" aria-label="Back to vehicles">
        <span class="ico ico--sm" data-ico="arrowLeft"></span>
      </a>
      <div>
        <h1>Vehicle Details</h1>
        <p id="pagebarSub">Specifications and fares</p>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="wrap" style="max-width:760px">
      <div id="detail"></div>
    </div>
  </section>
</main>

<div id="siteFooter"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/chrome.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var p = UI.params();
  var v = SA.vehicle(p.v) || SA.VEHICLES[0];
  var trip = (p.type === 'outstation') ? 'outstation' : 'local';
  var km = Number(p.km) > 0 ? Number(p.km) : 50;
  var host = document.getElementById('detail');

  document.title = v.name + ' — Sri Anjali Travels';
  document.getElementById('pagebarSub').textContent = v.name + ' · ' + v.example;

  var specRows = Object.keys(v.specs).map(function (k) {
    return '<tr><th scope="row">' + UI.esc(k) + '</th><td>' + UI.esc(v.specs[k]) + '</td></tr>';
  }).join('');

  var others = SA.VEHICLES.filter(function (o) { return o.id !== v.id; }).map(function (o) {
    return '<a class="fleet-card" href="vehicle.html?v=' + o.id + '">' +
      '<img src="' + o.img + '" alt="">' +
      '<h3>' + UI.esc(o.name) + '</h3>' +
      '<div class="seats">' + UI.esc(o.seats) + '</div>' +
    '</a>';
  }).join('');

  host.innerHTML =
    '<div class="panel">' +
      '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
        '<img src="' + v.img + '" alt="' + UI.esc(v.name) + '" style="width:120px">' +
        '<div>' +
          '<h2 style="font-size:22px">' + UI.esc(v.name) + '</h2>' +
          '<div class="muted small">' + UI.esc(v.example) + '</div>' +
          '<div class="small" style="color:var(--gold);font-weight:600">' + UI.esc(v.seats) + '</div>' +
        '</div>' +
      '</div>' +

      '<p class="muted mt-16">' + UI.esc(v.blurb) + '</p>' +

      '<div class="iconrow mt-16">' +
        '<div><span class="ico" data-ico="snow"></span><span>Air<br>Conditioned</span></div>' +
        '<div><span class="ico" data-ico="seat"></span><span>Comfortable<br>Seats</span></div>' +
        '<div><span class="ico" data-ico="bag"></span><span>Ample Luggage<br>Space</span></div>' +
      '</div>' +

      '<h3 class="mt-24" style="font-size:16px">Specifications</h3>' +
      '<div class="spec-wrap mt-12"><table class="spec"><tbody>' + specRows + '</tbody></table></div>' +

      '<h3 class="mt-24" style="font-size:16px">Estimate your fare</h3>' +
      '<div class="stack mt-12">' +
        '<div class="seg" id="vTrip" role="tablist" aria-label="Trip type">' +
          '<button type="button" role="tab" data-trip="local">Local</button>' +
          '<button type="button" role="tab" data-trip="outstation">Outstation</button>' +
        '</div>' +
        '<div class="field">' +
          '<label for="vKm">Trip Distance</label>' +
          '<div class="input-affix">' +
            '<input class="input" id="vKm" type="number" min="1" max="5000" step="1" inputmode="numeric" value="' + km + '">' +
            '<span class="suffix">KM</span>' +
          '</div>' +
        '</div>' +
        '<div class="fare-hero" id="vFare"></div>' +
        '<a class="btn btn--navy btn--block btn--lg" id="vBook" href="#">Book / Enquire Now</a>' +
        '<div class="note"><span class="ico" data-ico="info"></span>' +
          '<span>Fare = Distance (KM) × Per KM Rate. Toll, parking and state permit extra if applicable.</span></div>' +
      '</div>' +
    '</div>' +

    '<h3 class="mt-24" style="font-size:16px">Other vehicles</h3>' +
    '<div class="grid grid--4 mt-12">' + others + '</div>';

  var segEl = document.getElementById('vTrip');
  var kmEl = document.getElementById('vKm');
  var fareEl = document.getElementById('vFare');
  var bookEl = document.getElementById('vBook');

  function paint() {
    Array.prototype.forEach.call(segEl.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-trip') === trip ? 'true' : 'false');
    });
    var distance = Number(kmEl.value);
    var rate = SA.rateFor(v.id, trip);
    if (distance > 0) {
      var days = trip === 'outstation' ? SA.suggestedDays(distance, v.id) : 1;
      var q = SA.quote(v.id, trip, distance, { days: days });
      var sub = trip === 'outstation'
        ? 'Includes ' + q.chargeableKm + ' KM' +
          (q.minApplied ? ' (minimum ' + q.minKmPerDay + ' KM × ' + q.days + ' days)' : '') +
          ' and ' + SA.money(q.bata) + ' driver allowance'
        : SA.rate(rate);
      fareEl.innerHTML =
        '<div class="k">Estimate for ' + distance + ' KM (' + SA.tripLabel(trip) + ')</div>' +
        '<div class="v">' + SA.money(q.total) + '</div>' +
        '<div class="r">' + sub + '</div>';
    } else {
      fareEl.innerHTML =
        '<div class="k">Per KM rate (' + SA.tripLabel(trip) + ')</div>' +
        '<div class="v">' + SA.rate(rate) + '</div>' +
        '<div class="r">Enter a distance to see the total</div>';
    }
    bookEl.href = 'booking.html?' + UI.query({ v: v.id, type: trip, km: distance > 0 ? distance : '' });
  }

  segEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-trip]');
    if (!b) return;
    trip = b.getAttribute('data-trip');
    paint();
  });
  kmEl.addEventListener('input', paint);

  UI.hydrateIcons(host);
  paint();
});
</script>
</body>
</html>
